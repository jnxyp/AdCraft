[project]
name = "adframe-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "aiosqlite",
    "chromadb==1.5.8",
    "openai",
    "pillow",
    "python-dotenv",
    "httpx",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "types-pillow",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["api", "core", "generation", "image", "ranking", "retrieval", "sync", "main.py"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "chromadb"]
ignore_missing_imports = true
