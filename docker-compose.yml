services:
  adcraft-backend:
    container_name: adcraft-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADFRAME_DATA_DIR: /app/data
      ADFRAME_PIPELINE_DATA_DIR: /app/pipeline_data
    volumes:
      - ./data:/app/data
      - ./pipeline/data:/app/pipeline_data:ro
    ports:
      - "8000:8000"
    cpus: 1.0
    mem_limit: 1200m
    mem_reservation: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  adcraft-frontend:
    container_name: adcraft-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      adcraft-backend:
        condition: service_healthy
    ports:
      - "5173:80"
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
